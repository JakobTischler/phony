<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PHONY</title>
<style>
[hidden]{display:none!important}
@font-face{font-family:"Reenie Beanie";src:url(fonts/ReenieBeanie.ttf) format("truetype");font-display:block}
@font-face{font-family:"Michroma";src:url(fonts/Michroma-Regular.ttf) format("truetype");font-display:block}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(fonts/BarlowCondensed-SemiBold.ttf) format("truetype");font-display:block}
@font-face{font-family:"Barlow Condensed";font-weight:800;src:url(fonts/BarlowCondensed-ExtraBold.ttf) format("truetype");font-display:block}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-style:italic;src:url(fonts/BarlowCondensed-ExtraBoldItalic.ttf) format("truetype");font-display:block}
@font-face{font-family:"Zilla Slab";font-weight:700;src:url(fonts/ZillaSlab-Bold.ttf) format("truetype");font-display:block}
/* the pens that write on the playlist tapes */
@font-face{font-family:"Permanent Marker";src:url(fonts/PermanentMarker-Regular.ttf) format("truetype");font-display:block}
@font-face{font-family:"Nothing You Could Do";src:url(fonts/NothingYouCouldDo.ttf) format("truetype");font-display:block}
@font-face{font-family:"Rock Salt";src:url(fonts/RockSalt-Regular.ttf) format("truetype");font-display:block}
@font-face{font-family:"Caveat";font-weight:400 700;src:url(fonts/Caveat-Variable.ttf) format("truetype");font-display:block}
@font-face{font-family:"Gochi Hand";src:url(fonts/GochiHand-Regular.ttf) format("truetype");font-display:block}

/* Layout: product-photo backdrop. The Fold sits left at true proportions (closed 82×124 mm, open 161×124 mm); notes and tape shelf to the right, wrapping below when the phone is open. Single deliberate look. */
:root{
  --backdrop:#6d9a98; --backdrop-hi:#93bcb8; --backdrop-lo:#4c7978;
  --ink:#0f2428; --ink-soft:#2b4a4f; --card:rgba(236,243,240,.78); --card-line:rgba(15,36,40,.14);
  --anodized:#2b4d9e; --anodized-lo:#1d3576; --orange:#f5a01a; --led:#ff4a2e;
  --paper:#f3ecd9; --paper-lo:#e6dbc1; --pen:#1d3c8f; --rule:rgba(80,110,165,.28); --highlighter:rgba(255,228,70,.62);
  --f-brand:"Zilla Slab","Rockwell","Clarendon",Georgia,serif;
  --f-device:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-hand:"Reenie Beanie","Bradley Hand","Comic Sans MS",cursive;
  --f-print:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --lx:30%;--ly:25%;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#000;color:var(--ink);font-family:var(--f-brand);font-size:15px;line-height:1.5;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{-webkit-tap-highlight-color:transparent}
#cover,#inner{position:fixed;inset:0;border-radius:0;animation:none}
.stage{min-height:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:36px 44px;align-items:flex-start;justify-content:center;padding-inline:20px;padding-block:24px}
.devicecol{display:flex;flex-direction:column;align-items:center;gap:16px;flex:none;max-width:100%}

/* fold toggle */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(15,36,40,.14);gap:2px}
.seg button{font:inherit;font-weight:600;font-size:13px;letter-spacing:.02em;border:0;border-radius:999px;padding:7px 16px;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:#0f2428;color:#eef4f2}
.seg button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- phone ---------- */
.phone{--lx:30%;--ly:25%;position:relative;width:min(calc(80vh * .661),470px,calc(100vw - 40px));aspect-ratio:819/1239;background:#0c0e10;border-radius:8.5%/5.6%;padding:1.8%;box-sizing:border-box;box-shadow:0 40px 60px -20px rgba(10,30,32,.55),0 12px 18px rgba(10,30,32,.25),inset 0 0 0 1.5px #2b3035,inset 0 0 0 3px #0a0b0c}
.phone.open{width:min(calc(80vh * 1.3027),860px,calc(100vw - 40px));aspect-ratio:1614/1239;border-radius:4.4%/5.6%;padding:1.1%}
.screen{position:relative;width:100%;height:100%;border-radius:7%/4.6%;overflow:hidden;container-type:size;background:#000;animation:fadein .35s ease}
.inner{position:relative;width:100%;height:100%;border-radius:3.6%/4.7%;overflow:hidden;display:flex;background:#000;animation:fadein .35s ease}
.inner::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:14px;margin-left:-7px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 40%,rgba(255,255,255,.06) 55%,transparent);z-index:30}
@keyframes fadein{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.half{position:relative;flex:1;min-width:0;container-type:size;overflow:hidden}
.punch{position:absolute;top:1.8cqw;left:50%;width:3.4cqw;height:3.4cqw;margin-left:-1.7cqw;border-radius:50%;background:#050506;box-shadow:0 0 0 .5cqw rgba(0,0,0,.4);z-index:20}
.walkman{position:absolute;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}

.brushed{background-image:
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px)}
.top{position:relative;height:17cqw;flex:none;background-color:var(--anodized-lo);border-bottom:.5cqw solid #14255a;box-shadow:inset 0 -1px 0 rgba(255,255,255,.15)}
.top .row{position:absolute;left:7cqw;right:6cqw;top:4.2cqw;display:flex;align-items:center;justify-content:space-between}
.fxkey{position:relative;width:13cqw;height:5.2cqw;border:0;border-radius:1cqw;background:linear-gradient(180deg,#ffc15a,var(--orange) 55%,#d97f06);box-shadow:0 1.1cqw 0 #9a5a05,0 1.6cqw 1.6cqw rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;transition:transform .05s,box-shadow .05s}
.fxkey::after{content:"";position:absolute;inset:1.1cqw 2cqw;background:repeating-linear-gradient(90deg,rgba(120,60,0,.25) 0 .5cqw,transparent .5cqw 1.1cqw);border-radius:.4cqw}
.fxkey.down{transform:translateY(.9cqw);box-shadow:0 .2cqw 0 #9a5a05,0 .4cqw .6cqw rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.fxlabel{display:flex;align-items:center;gap:1.4cqw;font-family:var(--f-device);font-size:1.9cqw;letter-spacing:.14em;color:rgba(222,230,244,.8);margin-left:2.6cqw;margin-right:auto}
.led{width:1.7cqw;height:1.7cqw;border-radius:50%;background:#4a1810;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);flex:none}
.led.on{background:var(--led);box-shadow:0 0 1.4cqw var(--led),0 0 .4cqw #ffb09a}
.led.amber{background:#4a3410}
.led.amber.on{background:#ffb02e;box-shadow:0 0 1.4cqw #ffb02e}
.jacks{display:flex;gap:3.2cqw;align-items:flex-end}
.jack{display:flex;flex-direction:column;align-items:center;gap:.8cqw;font-family:var(--f-device);font-size:1.7cqw;color:rgba(222,230,244,.75)}
.jack i{display:block;width:4.6cqw;height:4.6cqw;border-radius:50%;background:radial-gradient(circle,#050608 36%,#3b3f46 38%,#c9a960 44%,#8a6d2f 60%,#1a1c20 64%)}
.brand{position:absolute;left:6.6cqw;top:9.4cqw;font-family:var(--f-brand);font-weight:700;font-size:8cqw;line-height:1;letter-spacing:.07em;color:#eef2f8;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.12)}
.model{position:absolute;left:7cqw;top:12.2cqw;font-family:var(--f-device);font-size:2.05cqw;letter-spacing:.2em;color:rgba(222,230,244,.72)}
.top.slim{height:21cqw}
.top.slim .brand{top:10.6cqw;font-size:7cqw}
.top.slim .model{top:auto;bottom:3.2cqw;left:auto;right:6cqw;font-size:1.8cqw}

.body{flex:1;display:flex;min-height:0}
.face{position:relative;flex:1;background-color:var(--anodized);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6cqw;overflow:hidden}
.face::after,.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60cqw 80cqw at var(--lx) var(--ly),rgba(255,255,255,.22),transparent 70%);mix-blend-mode:screen}
.top::after{background:radial-gradient(60cqw 40cqw at var(--lx) calc(var(--ly) * 3),rgba(255,255,255,.18),transparent 70%)}
.scuff{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(220,228,240,.22),transparent);pointer-events:none}
.engrave{font-family:var(--f-device);font-size:1.9cqw;letter-spacing:.2em;color:rgba(214,224,242,.72);text-shadow:0 -1px 0 rgba(0,0,0,.35);white-space:nowrap}
.window{position:relative;width:44.6cqw;aspect-ratio:.47;border-radius:2.2cqw;background:#08090b;box-shadow:inset 0 0 0 1.1cqw #0e1a3d,inset 0 1.6cqw 2.4cqw rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.2),0 -1px 0 rgba(0,0,0,.4);overflow:hidden}
.window canvas,.deck canvas{position:absolute;inset:0;width:100%;height:100%}
.window::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1.1cqw #0e1a3d;background:linear-gradient(118deg,transparent calc(var(--ly) * .6),rgba(255,255,255,.1) calc(var(--ly) * .6 + 8%),transparent calc(var(--ly) * .6 + 22%)),linear-gradient(180deg,rgba(255,255,255,.07),transparent 30%)}
.run{display:flex;gap:1.6cqw;align-items:center}
.bias{display:flex;gap:3.4cqw}
.bias span{font-family:var(--f-device);font-size:1.75cqw;letter-spacing:.14em;color:rgba(214,224,242,.35);transition:color .3s}
.bias span.on{color:rgba(240,246,255,.95);text-shadow:0 0 1cqw rgba(160,190,255,.5)}

.side{position:relative;width:24cqw;flex:none;background-color:#b9bec3;background-image:
  repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),
  linear-gradient(90deg,#8d9399,#d9dde0 26%,#c1c6ca 62%,#8f959b);
  border-left:.5cqw solid #6f757b;box-shadow:inset .6cqw 0 .8cqw rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:3cqw;box-sizing:border-box;gap:2.2cqw}
.side::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent calc(var(--ly) - 14%),rgba(255,255,255,.35) var(--ly),transparent calc(var(--ly) + 14%));mix-blend-mode:soft-light}
.mic{width:11cqw;height:6cqw;border-radius:1cqw;background:radial-gradient(circle,#30343a 32%,transparent 36%) 0 0/2.2cqw 2.2cqw,linear-gradient(#d6dade,#aeb3b8);box-shadow:inset 0 0 0 .4cqw #9aa0a6}
.tiny{font-family:var(--f-device);font-size:1.6cqw;letter-spacing:.12em;color:#3c4248;text-align:center;line-height:1.3}
.keys{display:flex;flex-direction:column;gap:2.4cqw;align-items:center}
.key{position:relative;width:17cqw;height:13.6cqw;border:0;padding:0;border-radius:1.4cqw;cursor:pointer;background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 .45cqw,rgba(255,255,255,.3) .45cqw .9cqw) 0 100%/100% 42% no-repeat,
  linear-gradient(180deg,#f3f5f6,#c3c8cc 55%,#a9aeb3);
  box-shadow:0 1.3cqw 0 #6c7278,0 1.8cqw 1.8cqw rgba(0,0,0,.35),inset 0 1px 0 #fff,inset 0 0 0 .3cqw rgba(0,0,0,.08);transition:transform .045s,box-shadow .045s;color:#262a2f}
.key span{position:absolute;top:1.5cqw;left:0;right:0;text-align:center;font-size:4.6cqw;line-height:1;letter-spacing:-.18em;font-family:Arial,sans-serif}
.key.down,.key.latched{transform:translateY(1.1cqw);box-shadow:0 .2cqw 0 #6c7278,0 .4cqw .7cqw rgba(0,0,0,.3),inset 0 1px 0 #fff,inset 0 0 0 .3cqw rgba(0,0,0,.1)}
.key.latched{background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 .45cqw,rgba(255,255,255,.3) .45cqw .9cqw) 0 100%/100% 42% no-repeat,linear-gradient(180deg,#e2e5e7,#b4b9bd 55%,#9ca1a6)}
.key.stop{background:repeating-linear-gradient(0deg,rgba(120,60,0,.28) 0 .45cqw,rgba(255,230,170,.35) .45cqw .9cqw) 0 100%/100% 42% no-repeat,linear-gradient(180deg,#ffc860,var(--orange) 55%,#d97f06);box-shadow:0 1.3cqw 0 #9a5a05,0 1.8cqw 1.8cqw rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);color:#5a3200}
.key.stop.down{box-shadow:0 .2cqw 0 #9a5a05,0 .4cqw .7cqw rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.key:focus-visible,.fxkey:focus-visible,.track:focus-visible{outline:.6cqw solid #ffd26a;outline-offset:.6cqw}
.vol{display:flex;gap:1.6cqw;align-items:stretch;height:22cqw}
.scale{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-device);font-size:1.5cqw;color:#3c4248}
.track{position:relative;width:6cqw;border-radius:3cqw;background:linear-gradient(90deg,#3a3f45,#1c1f23);box-shadow:inset 0 .4cqw .6cqw rgba(0,0,0,.6);cursor:ns-resize;touch-action:none}
.thumb{position:absolute;left:-1.4cqw;right:-1.4cqw;height:5.6cqw;margin-top:-2.8cqw;border-radius:1cqw;background:repeating-linear-gradient(0deg,#6d7379 0 .45cqw,#e4e7e9 .45cqw .9cqw);box-shadow:0 .6cqw .8cqw rgba(0,0,0,.4)}

/* in-screen tape picker (closed view) */
.picker{position:absolute;inset:0;z-index:5;background:rgba(14,26,62,.93);display:flex;flex-direction:column;padding:6cqw 4.5cqw;box-sizing:border-box;gap:3.5cqw;overflow-y:auto;opacity:0;transform:translateY(3cqw);transition:opacity .25s,transform .25s}
.picker.show{opacity:1;transform:none}
.picker h3{margin:0;font-family:var(--f-device);font-weight:400;font-size:2.6cqw;letter-spacing:.24em;color:#e6ecf7}
.picker .grid{display:grid;grid-template-columns:1fr 1fr;gap:3.4cqw}
.picker button{display:flex;flex-direction:column;gap:1.2cqw;align-items:flex-start;background:none;border:0;padding:0;cursor:pointer;color:#e6ecf7;text-align:left}
.picker canvas{width:100%;height:auto;aspect-ratio:1000/638;border-radius:1.2cqw;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
.picker b{font-family:var(--f-device);font-weight:400;font-size:2.1cqw;letter-spacing:.12em}
.picker button:focus-visible{outline:.6cqw solid #ffd26a;outline-offset:.6cqw;border-radius:1cqw}

/* ---------- open view: deck (right half) ---------- */
.deck{position:relative;flex:1;background:#1c1e22;overflow:hidden}
.deck::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70cqw 90cqw at var(--lx) var(--ly),rgba(255,255,255,.09),transparent 70%)}
.deckfoot{position:absolute;left:0;right:0;bottom:3cqw;display:flex;justify-content:center;gap:5cqw;align-items:center;z-index:2}
.deckfoot .engrave{color:rgba(214,220,230,.6)}

/* ---------- open view: cassette bay (right half) ---------- */
.deckfull{position:absolute;inset:0;background-color:var(--anodized);padding:2.4cqw 2.4cqw 2.4cqw 1.4cqw;box-sizing:border-box}
.deckfull .deck{height:100%;border-radius:2cqw;box-shadow:inset 0 0 0 .8cqw #0e1a3d,0 1px 0 rgba(255,255,255,.18)}
.deckfull::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70cqw 90cqw at calc(var(--lx) - 40%) var(--ly),rgba(255,255,255,.14),transparent 70%);mix-blend-mode:screen}
.keybar{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:2.6cqw;padding:2.6cqw 3.6cqw 4cqw;border-radius:1.6cqw;background-color:#b9bec3;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),linear-gradient(180deg,#d9dde0,#c1c6ca 55%,#8f959b);box-shadow:0 1cqw 2cqw rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.keybar .keys{flex-direction:row;gap:2cqw}
.keybar .key{width:12.6cqw;height:11.4cqw}
.keybar .key span{top:1.4cqw;font-size:4cqw}
.keybar .vol{height:15cqw}
.kb-fx{display:flex;flex-direction:column;align-items:flex-start;gap:1.8cqw}
.kb-leds{display:flex;align-items:center;gap:1cqw}
.kb-leds .led{margin-left:.6cqw}
.kb-brand{font-family:var(--f-brand);font-weight:700;font-size:3.6cqw;letter-spacing:.08em;color:#3a3f45;text-shadow:0 1px 0 rgba(255,255,255,.6)}

/* ---------- open view: J-card (left half) ---------- */
.lid{position:absolute;inset:0;background-color:var(--anodized-lo);display:flex;flex-direction:column;gap:3cqw;padding:4.2cqw;box-sizing:border-box}
.lid::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80cqw 70cqw at calc(var(--lx) + 40%) var(--ly),rgba(255,255,255,.16),transparent 70%);mix-blend-mode:screen}
.jcard{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;border-radius:1.2cqw;background:linear-gradient(180deg,var(--paper),var(--paper-lo));box-shadow:0 1.4cqw 3cqw rgba(0,0,0,.45),inset 0 0 0 .3cqw rgba(255,255,255,.4);overflow:hidden;color:#2a261d}
.jcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 40%),repeating-radial-gradient(circle at 30% 20%,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);z-index:3}
.spine{position:relative;flex:none;height:22cqw;display:flex;flex-direction:column;justify-content:flex-end}
.stripes{position:absolute;inset:0 0 auto 0;display:flex;flex-direction:column}
.stripes i{display:block}
.spine .meta{position:relative;display:flex;flex-direction:column-reverse;align-items:flex-start;padding:0 5cqw 1.6cqw;gap:.4cqw}
.spine .mixtitle{font-family:var(--f-hand);font-size:8.4cqw;line-height:.9;color:var(--pen);transform:rotate(-1.2deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.spine .type{font-family:var(--f-print);font-weight:600;font-size:2.8cqw;letter-spacing:.08em;color:#7a6b52;white-space:nowrap}
.albumart{display:none}
.now{flex:none;display:grid;grid-template-columns:auto 1fr;gap:1cqw 4cqw;align-items:center;padding:3cqw 5cqw 3.4cqw;border-block:.3cqw solid rgba(60,50,30,.18);background:rgba(255,255,255,.28)}
.counter{display:flex;flex-direction:column;align-items:center;gap:1.2cqw}
.drums{display:flex;gap:.5cqw;padding:.9cqw;border-radius:1cqw;background:#1b1c1f;box-shadow:inset 0 .6cqw 1cqw rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.6)}
.drum{width:5cqw;height:7cqw;overflow:hidden;border-radius:.4cqw;background:linear-gradient(180deg,#bdb9ae,#f4f1e8 35%,#f4f1e8 65%,#b9b5aa);position:relative}
.drum div{position:absolute;left:0;right:0;top:0;font-family:var(--f-print);font-weight:800;font-size:6cqw;line-height:7cqw;text-align:center;color:#17181a;will-change:transform}
.drum div span{display:block;height:7cqw}
.reset{font-family:var(--f-device);font-size:1.7cqw;letter-spacing:.14em;border:0;border-radius:.8cqw;padding:.9cqw 1.8cqw;background:linear-gradient(#e7e9eb,#aeb3b8);box-shadow:0 .5cqw 0 #6c7278;color:#2c3035;cursor:pointer}
.reset:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 #6c7278}
.reset:focus-visible{outline:.5cqw solid var(--orange);outline-offset:.4cqw}
.nowtext{min-width:0}
.nowlabel{font-family:var(--f-print);font-weight:600;font-size:2.6cqw;letter-spacing:.16em;color:#8a7a5c}
.nowtitle{font-family:var(--f-hand);font-size:8cqw;line-height:.95;color:var(--pen);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nowartist{font-family:var(--f-hand);font-size:6cqw;line-height:1;color:rgba(29,60,143,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowtime{font-family:var(--f-print);font-weight:600;font-size:3cqw;color:#6f6250;font-variant-numeric:tabular-nums;margin-top:.6cqw}
.jlist{flex:1;min-height:0;overflow-y:auto;margin:0;padding:1.4cqw 0 2cqw;list-style:none;background:linear-gradient(90deg,transparent 12.4cqw,rgba(200,60,50,.35) 12.4cqw 12.8cqw,transparent 12.8cqw),repeating-linear-gradient(180deg,transparent 0 calc(8.4cqw - 1px),var(--rule) calc(8.4cqw - 1px) 8.4cqw);background-position:0 1.4cqw;scrollbar-width:thin}
.jlist button{position:relative;width:100%;height:8.4cqw;display:grid;grid-template-columns:7.4cqw 1fr auto;gap:1.6cqw;align-items:end;padding:0 5cqw 1.3cqw 5cqw;box-sizing:border-box;border:0;background:none;cursor:pointer;text-align:left;color:inherit}
.jlist .n{font-family:var(--f-hand);font-size:5.4cqw;line-height:1;color:var(--pen);text-align:right}
.jlist .t{font-family:var(--f-hand);font-size:5.8cqw;line-height:1;color:var(--pen);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jlist .t small{font-size:4.4cqw;color:rgba(29,60,143,.6)}
.jlist .d{font-family:var(--f-hand);font-size:4.8cqw;line-height:1;color:rgba(29,60,143,.7)}
.jlist li.cur button::before{content:"";position:absolute;left:12cqw;right:3cqw;top:1.6cqw;bottom:.8cqw;background:var(--highlighter);border-radius:1cqw .4cqw 1.4cqw .6cqw;transform:skewX(-8deg) rotate(-.6deg);mix-blend-mode:multiply}
.jlist button > *{position:relative}
.jlist button:focus-visible{outline:.5cqw solid var(--orange);outline-offset:-.5cqw}
.jcard.printed{--pen:#2a261d}
.jcard.printed .jlist .n,.jcard.printed .jlist .t,.jcard.printed .jlist .d,.jcard.printed .nowtitle,.jcard.printed .nowartist{font-family:var(--f-print);font-weight:600}
.jcard.printed .jlist .t{font-size:4.2cqw}.jcard.printed .jlist .n,.jcard.printed .jlist .d{font-size:3.6cqw}
.jcard.printed .jlist .t small{font-size:3.2cqw;color:#7a6b52}
.jcard.printed .nowtitle{font-size:6.4cqw;line-height:1.05}.jcard.printed .nowartist{font-size:4cqw;color:#6f6250}
.jcard.printed .spine{height:34cqw}
.jcard.printed .stripes,.jcard.printed .spine .meta{display:none}
.jcard.printed .albumart{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.shelfstrip{flex:none;display:flex;gap:3cqw;overflow-x:auto;padding:3cqw 5cqw 3.4cqw;background:rgba(40,34,22,.08);border-top:.3cqw solid rgba(60,50,30,.18);scrollbar-width:thin;transition:background .3s}
.shelfstrip.ask{background:rgba(245,160,26,.28);animation:ask 1.2s ease-in-out infinite}
@keyframes ask{50%{background:rgba(245,160,26,.12)}}
.shelfstrip button{flex:none;width:24cqw;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:1cqw;align-items:flex-start}
.shelfstrip canvas{width:100%;height:auto;aspect-ratio:1000/638;border-radius:.8cqw;box-shadow:0 .8cqw 1.4cqw rgba(0,0,0,.35)}
.shelfstrip b{font-family:var(--f-print);font-weight:600;font-size:2.6cqw;letter-spacing:.06em;color:#4d4433;white-space:nowrap}
.shelfstrip button.on canvas{box-shadow:0 0 0 .6cqw var(--anodized),0 .8cqw 1.4cqw rgba(0,0,0,.35)}
.shelfstrip button:focus-visible{outline:.5cqw solid var(--orange);outline-offset:.5cqw}

/* ---------- notes column ---------- */
.notes{flex:1 1 320px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-device);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
h1{margin:4px 0 0;font-family:var(--f-brand);font-weight:700;font-size:clamp(34px,5vw,50px);letter-spacing:.07em;line-height:1.05}
.lede{margin:10px 0 0;max-width:60ch;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:16px 18px;backdrop-filter:blur(6px)}
.card h2{margin:0 0 10px;font-family:var(--f-device);font-weight:400;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.howto{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.howto dt{font-family:Arial,sans-serif;font-weight:700;white-space:nowrap}
.howto dd{margin:0;color:var(--ink-soft)}
.howto dt.orange{color:#b86b00;font-family:var(--f-body);font-size:13px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.shelf button{display:flex;flex-direction:column;gap:6px;border:0;padding:0;background:none;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.shelf canvas{width:100%;height:auto;aspect-ratio:1000/638;border-radius:6px;box-shadow:0 6px 12px -4px rgba(10,30,32,.45);transition:transform .15s}
.shelf button:hover canvas{transform:translateY(-2px) rotate(-1deg)}
.shelf button.on canvas{box-shadow:0 0 0 2.5px var(--anodized),0 6px 12px -4px rgba(10,30,32,.45)}
.shelf b{font-size:13px;font-weight:600;line-height:1.2}
.shelf small{display:block;font-size:12px;color:var(--ink-soft)}
.shelf button:focus-visible{outline:2px solid var(--anodized);outline-offset:3px;border-radius:6px}
.load{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:#eef4f2;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.fine{font-size:13px;color:var(--ink-soft);margin:0}
@media (prefers-reduced-motion:reduce){.picker,.screen,.inner{transition:none;animation:none}.shelfstrip.ask{animation:none}}

/* ---------- music chooser ---------- */
.spine{border:0;padding:0;margin:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.spine:focus-visible{outline:.5cqw solid var(--orange);outline-offset:-.5cqw}
.jlist li.past button{opacity:.55}
.sheet{position:absolute;inset:4.2cqw;z-index:40;display:flex;flex-direction:column;border-radius:1.2cqw;background:linear-gradient(180deg,#fbf7ec,#efe6cf);box-shadow:0 2cqw 5cqw rgba(0,0,0,.6);overflow:hidden;color:#2a261d}
.sheethead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:3.4cqw 4.4cqw;background:#c8372d;color:#fbf2df}
.sheethead b{font-family:var(--f-device);font-weight:400;font-size:2.6cqw;letter-spacing:.22em}
.sheethead button{font-family:var(--f-device);font-size:2.2cqw;letter-spacing:.16em;border:0;border-radius:.8cqw;padding:1.4cqw 2.6cqw;background:#fbf2df;color:#8a2a22;cursor:pointer}
.sheetbody{flex:1;overflow-y:auto;padding:1cqw 0 4cqw}
.sheetbody h4{margin:3.6cqw 4.4cqw 1.2cqw;font-family:var(--f-print);font-weight:600;font-size:2.8cqw;letter-spacing:.18em;color:#8a7a5c}
.srow{display:flex;flex-direction:column;align-items:flex-start;gap:.4cqw;width:100%;border:0;border-bottom:.25cqw solid rgba(80,110,165,.2);background:none;padding:2.2cqw 4.4cqw;text-align:left;cursor:pointer;color:inherit}
.srow b{font-family:var(--f-hand);font-weight:400;font-size:6.4cqw;line-height:1;color:var(--pen)}
.srow small{font-family:var(--f-print);font-weight:600;font-size:3cqw;color:#6f6250}
.srow.ask b{color:#b04a10}
.srow.muted{cursor:default}
.srow:active{background:rgba(255,228,70,.35)}
.toast{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);z-index:99;max-width:80vw;padding:12px 18px;border-radius:12px;background:rgba(15,20,30,.92);color:#eef2f8;font-family:var(--f-print);font-weight:600;font-size:17px;letter-spacing:.02em;text-align:center}

/* ---------- the tape box ---------- */
.walkman{transition:transform .5s cubic-bezier(.3,.8,.3,1)}
#cover{background:#241a14}
#cover.boxopen .walkman{transform:translateY(-84%);box-shadow:0 2cqw 4cqw rgba(0,0,0,.6)}
#cover .walkman{z-index:2;background:#000}
.jstack{position:relative;flex:1;min-height:0;border-radius:1.2cqw}
.jstack .jcard{position:absolute;inset:0;z-index:2;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.lid.boxopen .jstack .jcard{transform:translateY(calc(100% + 6cqw)) rotate(2deg)}
.lid .keybar{z-index:3}
.boxbay{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;
  background:
    repeating-linear-gradient(94deg,rgba(0,0,0,.08) 0 .5cqw,transparent .5cqw 3cqw),
    repeating-linear-gradient(88deg,rgba(255,220,170,.035) 0 .3cqw,transparent .3cqw 5cqw),
    linear-gradient(180deg,#4a3324,#2e2018 70%,#241912)}
.boxbay::-webkit-scrollbar{display:none}
.boxbay.c{padding:calc(151cqw * .16 + 3cqw) 0 6cqw;box-sizing:border-box;opacity:0;transition:opacity .3s;z-index:1}
#cover.boxopen .boxbay.c{opacity:1}
.boxbay.o{border-radius:1.2cqw;padding:4cqw 0 6cqw;box-sizing:border-box;z-index:1}
.boxes{display:flex;flex-direction:column;align-items:center;gap:5cqw}
.box{position:relative;width:88cqw;padding:5.4cqw 3cqw 3.2cqw;box-sizing:border-box;border-radius:2.2cqw;
  background:linear-gradient(180deg,rgba(58,50,46,.9),rgba(30,26,24,.94));
  box-shadow:0 2.4cqw 3.6cqw rgba(0,0,0,.55),inset 0 0 0 .5cqw rgba(0,0,0,.35),inset 0 .5cqw 0 rgba(255,255,255,.12)}
.box::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:linear-gradient(112deg,rgba(255,255,255,.1),transparent 26%,transparent 60%,rgba(255,255,255,.05) 70%,transparent 78%)}
.box::after{content:"";position:absolute;left:-.6cqw;right:-.6cqw;top:-.6cqw;height:4.2cqw;border-radius:2.2cqw 2.2cqw 1cqw 1cqw;background:linear-gradient(180deg,#5d534c,#2b2522);box-shadow:0 .6cqw 1cqw rgba(0,0,0,.45);z-index:2}
.dymo{position:absolute;top:.5cqw;left:50%;transform:translateX(-50%) rotate(-1deg);z-index:4;padding:.3cqw 2.4cqw;border-radius:.4cqw;background:#c62b24;color:#fbe9e2;font-family:var(--f-print);font-weight:800;font-size:2.6cqw;letter-spacing:.3em;text-shadow:0 .15cqw 0 rgba(0,0,0,.35);box-shadow:0 .2cqw .3cqw rgba(0,0,0,.5)}
.slots{position:relative;display:flex;flex-direction:column;gap:.7cqw;padding:.7cqw;border-radius:1cqw;background:repeating-linear-gradient(180deg,#141210 0 11.3cqw,#2a2522 11.3cqw 12cqw);box-shadow:inset 0 .8cqw 1.4cqw rgba(0,0,0,.8)}
.case{position:relative;height:11.3cqw;width:100%;border:0;padding:0;cursor:pointer;display:block;background:none;transition:transform .28s cubic-bezier(.3,.8,.3,1);transform:translateX(var(--jx,0)) rotate(var(--jr,0deg))}
.case .sp{position:absolute;inset:.9cqw 1.4cqw;display:flex;align-items:center;gap:2cqw;overflow:hidden;background:var(--bg);color:var(--fg);border-radius:.2cqw;padding-right:2.4cqw}
.case .sp canvas{flex:none;height:100%;width:auto;aspect-ratio:1}
.case .sp .who{font-family:var(--f-print);font-weight:800;font-size:3.5cqw;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
.case .sp .what{flex:1;min-width:0;font-family:var(--f-print);font-weight:600;font-size:3.5cqw;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;text-transform:uppercase}
.case .sp .yr{flex:none;font-family:var(--f-print);font-weight:600;font-size:2.5cqw;letter-spacing:.1em;opacity:.7}
.case::before{content:"";position:absolute;inset:0;border-radius:.8cqw;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 18%,transparent 40%,transparent 78%,rgba(255,255,255,.1) 90%,rgba(255,255,255,.22));
  box-shadow:inset 0 0 0 .3cqw rgba(230,240,245,.28),0 .3cqw .5cqw rgba(0,0,0,.5)}
.case::after{content:"";position:absolute;top:2.6cqw;bottom:2.6cqw;left:.3cqw;width:.8cqw;border-radius:.3cqw;background:rgba(220,230,236,.35);z-index:3;box-shadow:calc(88cqw - 12.2cqw) 0 0 rgba(220,230,236,.35)}
.case:active,.case.pull{transform:translateX(calc(var(--jx,0) + 5cqw)) rotate(var(--jr,0deg))}
.case.fresh{animation:fresh .7s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes fresh{from{transform:translateX(-110%) rotate(-3deg);opacity:.3}}
.case:focus-visible{outline:.5cqw solid var(--orange);outline-offset:.2cqw}
.gap{height:11.3cqw;border-radius:.8cqw;box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.gap i{font-family:var(--f-hand);font-size:5.6cqw;color:rgba(255,236,210,.32);font-style:normal;transform:rotate(-1.5deg)}
.slot0{height:11.3cqw}
/* the drawer: playlist tapes, tossed in loose */
.drawer{position:relative;width:88cqw;padding:7cqw 3cqw 4cqw;box-sizing:border-box;border-radius:2.2cqw;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 .4cqw,transparent .4cqw 4cqw),linear-gradient(180deg,#3b2a1f,#2a1d15);
  box-shadow:inset 0 1.4cqw 2.4cqw rgba(0,0,0,.7),inset 0 0 0 .6cqw rgba(0,0,0,.35),0 .5cqw 0 rgba(255,220,170,.08)}
.drawer .dymo{top:1.6cqw}
.blanks{display:grid;grid-template-columns:1fr 1fr;gap:5cqw 5cqw}
.blanks button{position:relative;display:flex;flex-direction:column;gap:1.2cqw;align-items:flex-start;min-width:0;background:none;border:0;padding:0;cursor:pointer;color:rgba(255,236,210,.8);text-align:left;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.blanks button:active{transform:translate(var(--x,0),calc(var(--y,0) - 1.5cqw)) rotate(calc(var(--r,0deg) * .4)) scale(1.03)}
.blanks canvas{width:100%;height:auto;aspect-ratio:1000/638;border-radius:1.2cqw;box-shadow:0 1.4cqw 2.4cqw rgba(0,0,0,.55)}
.blanks b{max-width:100%;font-family:var(--f-print);font-weight:600;font-size:2.8cqw;letter-spacing:.08em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.blanks small{font-family:var(--f-print);font-weight:600;font-size:2.2cqw;letter-spacing:.1em;opacity:.55;margin-top:-.8cqw}
.blanks .gone{aspect-ratio:1000/638;width:100%;border-radius:1.2cqw;box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.blanks .gone i{font-family:var(--f-hand);font-size:5cqw;color:rgba(255,236,210,.35);font-style:normal;transform:rotate(-2deg)}
.blanks .case.note{grid-column:1/-1;transform:none}
.blanks button:focus-visible{outline:.5cqw solid var(--orange);outline-offset:.5cqw}

/* one case, out of the box */
.caseview{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;background:rgba(18,12,8,.72);opacity:0;transition:opacity .25s}
.caseview.show{opacity:1}
.bigcase{position:relative;width:62cqw;aspect-ratio:70/109;border:0;padding:0;background:none;cursor:pointer;perspective:220cqw;transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .45s}
.bigcase .tray{position:absolute;inset:0;border-radius:1.4cqw;background:linear-gradient(180deg,rgba(40,40,44,.55),rgba(20,20,22,.7));box-shadow:0 3cqw 5cqw rgba(0,0,0,.6),inset 0 0 0 .4cqw rgba(220,235,240,.25)}
.bigcase .tray canvas{position:absolute;left:6%;top:50%;width:88%;height:auto;transform:translateY(-50%) rotate(-90deg) scale(1.5);transform-origin:50% 50%;opacity:0;transition:opacity .2s;border-radius:2cqw}
.bigcase .lidf{position:absolute;inset:0;border-radius:1.4cqw;transform-origin:0 50%;transition:transform .55s cubic-bezier(.4,.1,.3,1);transform-style:preserve-3d}
.bigcase .lidf canvas{position:absolute;inset:3% 4% 3% 6%;width:90%;height:94%;border-radius:.4cqw;backface-visibility:hidden}
.bigcase .lidf::after{content:"";position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;
  background:linear-gradient(118deg,rgba(255,255,255,.3),rgba(255,255,255,.04) 30%,transparent 55%,rgba(255,255,255,.12) 64%,transparent 72%);
  box-shadow:inset 0 0 0 .5cqw rgba(225,238,244,.4),inset 1.6cqw 0 0 -1cqw rgba(225,238,244,.3)}
.bigcase.opening .lidf{transform:rotateY(-150deg)}
.bigcase.opening .tray canvas{opacity:1}
.bigcase.gone{transform:translateY(-30%) scale(.7);opacity:0}
.caseinfo{text-align:center;color:#f6ead6;max-width:80cqw}
.caseinfo b{display:block;font-family:var(--f-print);font-weight:800;font-size:5.4cqw;letter-spacing:.04em;line-height:1.05;text-transform:uppercase}
.caseinfo small{display:block;font-family:var(--f-print);font-weight:600;font-size:3.4cqw;letter-spacing:.12em;opacity:.7;text-transform:uppercase;margin-top:.8cqw}
.lid,.jstack{overflow:clip}
.case.note .sp{background:linear-gradient(180deg,#f4edda,#e6dbc1);justify-content:center;padding:0 3cqw}
.case.note .hw{font-family:var(--f-hand);font-size:6cqw;line-height:1;color:var(--pen);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1deg)}
.case:disabled{cursor:default}

/* ---------- the fold-out J-card (tap the song banner) ---------- */
.nowtext{cursor:pointer;position:relative}
.pulltab{position:absolute;top:-1.6cqw;right:-2cqw;font-family:var(--f-print);font-weight:600;font-size:2.3cqw;letter-spacing:.14em;color:#8a7a5c;padding:.5cqw 1.4cqw;border-radius:.6cqw;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 .2cqw rgba(60,50,30,.18)}
.fold{--pw:min(calc(88vh * .64),44vw);--ph:calc(var(--pw) / .64);--acc:#c8372d;position:absolute;inset:0;z-index:50;background:rgba(14,10,7,0);transition:background .35s;overflow:hidden}
.fold.show{background:rgba(14,10,7,.8)}
.foldscroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:calc((100vw - 2.2 * var(--pw)) / 2);scrollbar-width:none;overscroll-behavior:contain;display:flex;align-items:center}
.foldscroll::-webkit-scrollbar{display:none}
.foldstrip{display:flex;align-items:center;padding-inline:calc((100vw - 2.2 * var(--pw)) / 2);perspective:260vw}
.fp{--i:0;position:relative;flex:none;width:var(--pw);height:var(--ph);max-height:92vh;container-type:size;overflow:hidden;scroll-snap-align:start;color:#2a241a;
  background:linear-gradient(180deg,#f6efdf,#ebe0c6);transform-origin:0 50%;
  transform:translateX(calc(var(--i) * -100%)) rotateY(calc(var(--f,1) * 88deg));opacity:0;
  transition:transform .75s cubic-bezier(.3,.7,.2,1) calc(var(--i) * 90ms),opacity .3s calc(var(--i) * 90ms)}
.fp:nth-child(even){--f:-1}
.fold.show .fp{transform:none;opacity:1}
.fp::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 5%,transparent 93%,rgba(255,255,255,.28)),repeating-radial-gradient(circle at 30% 20%,rgba(80,60,20,.018) 0 1px,transparent 1px 3px)}
.fp:nth-child(even)::before{background:linear-gradient(90deg,rgba(255,255,255,.3),transparent 6%,transparent 94%,rgba(0,0,0,.14)),repeating-radial-gradient(circle at 70% 60%,rgba(80,60,20,.018) 0 1px,transparent 1px 3px)}
.fp.fspine{width:calc(var(--pw) * .2)}
.fbody{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:7cqw 7cqw 9cqw;box-sizing:border-box;scrollbar-width:none;overscroll-behavior:contain}
.fbody::-webkit-scrollbar{display:none}
.fk{font-family:var(--f-print);font-weight:600;font-size:3.2cqw;letter-spacing:.22em;color:var(--acc);margin:0 0 1.6cqw}
.fh{font-family:var(--f-brand);font-weight:700;font-size:7.4cqw;line-height:1.02;margin:0 0 3cqw;letter-spacing:.01em}
.fbody p{font-family:Georgia,"Times New Roman",serif;font-size:4.1cqw;line-height:1.5;margin:0 0 2.6cqw;hyphens:auto;text-align:justify}

<script>
(() => {
const N = window.PhonyNative || null;
const W = 1000, H = 638, HUB1 = {x:290, y:280}, HUB2 = {x:710, y:280};
const RMIN = 72, RMAX = 206, LINEAR = 476, REMOTE_SIDE = 2700;
const PRINT = '"Barlow Condensed","Arial Narrow",sans-serif', HAND = '"Reenie Beanie","Bradley Hand",cursive';
const TAU = Math.PI * 2;

const DEMO = [
  {title:'Once in a Lifetime', artist:'Talking Heads', dur:259},
  {title:'Just Like Heaven', artist:'The Cure', dur:212},
  {title:'Take On Me', artist:'a-ha', dur:228},
  {title:'Hounds of Love', artist:'Kate Bush', dur:182},
  {title:'Everybody Wants to Rule the World', artist:'Tears for Fears', dur:251},
  {title:'Dancing in the Dark', artist:'Bruce Springsteen', dur:241},
];
const ALBUM = {title:'Low Tide Radio', artist:'The Marlinspikes', img:null, key:''};

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fit(c, text, x, y, maxW, size, family, weight=''){
  let s = size; c.font = `${weight} ${s}px ${family}`;
  while (c.measureText(text).width > maxW && s > 12){ s -= 2; c.font = `${weight} ${s}px ${family}`; }
  c.fillText(text, x, y);
}
function hand(c, text, x, y, maxW, size, color, tilt=-0.012){
  c.save(); c.translate(x, y); c.rotate(tilt); c.fillStyle = color; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  fit(c, text, 0, 0, maxW, size, HAND); c.restore();
}
function writeStrip(c, x, y, w, h, fill, line){
  c.fillStyle = fill; c.fillRect(x, y, w, h);
  if (line){ c.strokeStyle = line; c.lineWidth = 2; c.strokeRect(x, y, w, h); }
}

const labels = {
  mix(c, info){
    const g = c.createLinearGradient(0, 50, 0, 470); g.addColorStop(0, '#f4edda'); g.addColorStop(1, '#e5dac0');
    c.fillStyle = g; c.fillRect(60, 50, 880, 420);
    c.fillStyle = '#c8372d'; c.fillRect(60, 62, 880, 28);
    c.fillStyle = '#ea8a2a'; c.fillRect(60, 94, 880, 12);

    c.fillText('TYPE I  ·  NORMAL BIAS  ·  C60', 916, 77);

    if (info.pen) return;
    hand(c, info.title, 146, 160, 760, 60, '#1d3c8f');

  },
  chrome(c, info){

    const cols = ['#c9a55a', '#efe0ae', '#9ea1a8', '#dfe1e5'];
    cols.forEach((col, i) => { c.fillStyle = col; c.beginPath(); const o = i * 24;
      c.moveTo(60 + o, 470); c.lineTo(76 + o, 470); c.lineTo(296 + o, 50); c.lineTo(280 + o, 50); c.fill(); });
    const sg = c.createLinearGradient(0, 80, 0, 160); sg.addColorStop(0, '#ffffff'); sg.addColorStop(.5, '#9ea3ab'); sg.addColorStop(.55, '#6c7078'); sg.addColorStop(1, '#e6e8eb');
    c.fillStyle = sg; c.font = `italic 800 98px ${PRINT}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText('HX·90', 340, 160);
    c.fillStyle = '#c9a55a'; c.font = `600 21px ${PRINT}`; c.textAlign = 'right'; c.fillText('HIGH BIAS  ·  CrO₂  ·  EQ 70µs', 918, 92);
    c.fillStyle = '#8b8e95'; c.fillText('SIDE ' + info.side, 918, 122);
    writeStrip(c, 92, 396, 818, 62, '#eceae3');
    if (!info.pen) hand(c, `${info.idx + 1}. ${info.cur.title}`, 104, 443, 790, 46, '#111');
  },
  clear(c, info){
    const g = c.createLinearGradient(60, 0, 940, 0); g.addColorStop(0, '#ff3f8e'); g.addColorStop(.55, '#ff8a3d'); g.addColorStop(1, '#ffd23f');
    c.fillStyle = g; c.fillRect(60, 56, 880, 96);
    c.fillStyle = '#111'; c.font = `italic 800 66px ${PRINT}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText('CLEAR 90', 88, 130);
    c.font = `600 21px ${PRINT}`; c.textAlign = 'right'; c.fillText('SEE-THRU SHELL · TYPE II · SIDE ' + info.side, 918, 128);
    writeStrip(c, 92, 400, 818, 58, 'rgba(255,255,255,.92)');
    if (!info.pen) hand(c, `${info.idx + 1}. ${info.cur.title}`, 104, 445, 790, 44, '#1b1b1b');
  },
  memphis(c, info){
    c.fillStyle = '#f7f4ec'; c.fillRect(60, 50, 880, 420);
    const r = rng(7), cols = ['#ff5fa2', '#19b5a5', '#ffcf33', '#1a1a1a', '#5b6cff'];
    for (let i = 0; i < 46; i++){
      const x = 60 + r() * 880, y = 50 + r() * 420, col = cols[(r() * cols.length) | 0], t = r();
      c.save(); c.translate(x, y); c.rotate(r() * Math.PI * 2); c.fillStyle = c.strokeStyle = col; c.lineWidth = 7; c.lineCap = 'round';
      if (t < .3){ c.beginPath(); for (let k = 0; k <= 12; k++){ const px = k * 7 - 42, py = Math.sin(k * .9) * 10; k ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke(); }
      else if (t < .5){ c.beginPath(); c.moveTo(0, -16); c.lineTo(15, 12); c.lineTo(-15, 12); c.fill(); }

    if (!info.pen) hand(c, `${info.idx + 1}. ${info.cur.title}`, 104, 444, 790, 44, '#111');
  },
  metal(c, info){
    const g = c.createLinearGradient(60, 50, 940, 470); g.addColorStop(0, '#6a6e75'); g.addColorStop(.5, '#2d3036'); g.addColorStop(1, '#707580');
    c.fillStyle = g; c.fillRect(60, 50, 880, 420);

    c.fillStyle = '#d23a2e'; c.fillRect(60, 166, 880, 6);

    c.fillStyle = 'rgba(255,200,120,.55)';
    for (let i = 0; i < 7; i++){ const w = 180 - i * 22; c.fillRect(730 - w / 2, 344 + i * 17, w, 5); }
    }
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#fff3df'; fit(c, (A.title || '').toUpperCase(), 88, 124, 820, 62, PRINT, '800');
    c.fillStyle = 'rgba(255,243,223,.85)'; fit(c, (A.artist || '').toUpperCase().split('').join(' '), 90, 160, 820, 24, PRINT, '600');

function penWrite(c, pen, text, wr, tilt){
  c.save(); c.translate(wr.x, wr.y); c.rotate(tilt || 0); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  let sz = wr.size * pen.k; const set = () => { c.font = `${pen.weight || ''} ${sz}px ${pen.font}`; };
  set(); while (c.measureText(text).width > wr.w && sz > 16){ sz -= 2; set(); }
  if (pen.bleed){ c.globalAlpha = .35; c.fillStyle = pen.color; c.fillText(text, .8, .6); c.fillText(text, -.6, .4); }
  c.globalAlpha = pen.dark ? .96 : .92; c.fillStyle = pen.color; c.fillText(text, 0, 0);
  // a little more ink, so the name still reads when the tape is small
  c.lineWidth = sz * (pen.thin ? .045 : .022); c.lineJoin = 'round'; c.strokeStyle = pen.color; c.strokeText(text, 0, 0);
  c.restore();
}

const packR = f => Math.sqrt(RMIN * RMIN + Math.max(0, Math.min(1, f)) * (RMAX * RMAX - RMIN * RMIN));

  c.fillStyle = '#7d6a53'; c.fillRect(470, 574, 60, 18);
  [[HUB1, R1, a1], [HUB2, R2, a2]].forEach(([h, R, a]) => {
    const pg = c.createRadialGradient(h.x, h.y, RMIN * .9, h.x, h.y, R);

    c.fillStyle = pg; c.beginPath(); c.arc(h.x, h.y, R, 0, 7); c.fill();

    for (let rr = RMIN + 10; rr < R; rr += 13){ c.beginPath(); c.arc(h.x, h.y, rr, 0, 7); c.stroke(); }
    c.fillStyle = 'rgba(255,235,210,.07)'; c.beginPath(); c.moveTo(h.x, h.y); c.arc(h.x, h.y, R, -2.5, -1.9); c.fill();
    c.save(); c.translate(h.x, h.y); c.rotate(a);

function setAlbum(title, artist, dataUrl, key){

  if (key === ALBUM.key){ done(); return; }
  ALBUM.key = key;
  if (dataUrl){ const img = new Image(); img.onload = () => { ALBUM.img = img; done(); }; img.onerror = () => { ALBUM.img = null; done(); }; img.src = dataUrl; }
  else { ALBUM.img = null; done(); }
}
function setAlbumMode(on){
  if (on === S.albumMode) return; S.albumMode = on;

/* ---------- phone bridge: local library and other apps ---------- */
let pollAt = 0, remoteMissing = 0, ctxAt = 0;
const sameName = (a, b) => !!a && !!b && a.trim().toLowerCase() === b.trim().toLowerCase();
function pollNative(now){
  if (!N || now - pollAt < 33) return; pollAt = now;
  if (isLocal()){
    let st; try { st = JSON.parse(N.getState()); } catch (e) { return; }
    if (st.index >= 0 && st.index < S.tracks.length && st.index !== S.idx){ S.idx = st.index; trackChanged(); }
    if (!S.cue) S.t = st.pos / 1000;
    const tr = S.tracks[S.idx]; if (tr && st.dur > 0 && Math.abs((tr.dur || 0) - st.dur / 1000) > 1){ tr.dur = st.dur / 1000; }
    if (now - S.cmdAt > 800 && st.playing !== S.playing){
      if (!st.playing && st.ended){ S.playing = false; sfx('pop'); } else S.playing = st.playing;
      syncKeys();
    }
  } else if (isRemote()){
    const raw = N.getRemote();
    if (!raw){ if (++remoteMissing === 90) toast('Nothing is playing in another app. Start Spotify, then come back.'); return; }
    remoteMissing = 0;
    let st; try { st = JSON.parse(raw); } catch (e) { return; }
    const R = S.r, key = st.title + '|' + st.artist;
    if (key !== R.key){
      if (R.cur){ const played = R.cur.dur || S.t; R.hist.push({...R.cur, past:true}); R.done += played; if (R.hist.length > 40) R.hist.shift(); }
      R.key = key; R.cur = {title:st.title, artist:st.artist, album:st.album, dur:st.dur / 1000};
      S.src.app = st.app;
      const prevAlbum = R.hist.length ? R.hist[R.hist.length - 1].album : '';
      judgeTape(st, prevAlbum, true);
      buildRemoteTracks(st.queue || []);
    }
    // cover art often arrives a moment after the track changes
    if (st.artKey !== R.artKey){ R.artKey = st.artKey; setAlbum(st.album, st.albumArtist || st.artist, st.hasArt ? N.getRemoteArt() : '', st.artKey); }
    // Spotify itself says whether it's playing an album; checked every second
    if (now - ctxAt > 1000){ ctxAt = now; judgeTape(st, '', false); }
    if (!S.cue) S.t = st.pos / 1000;
    if (st.dur > 0) R.cur.dur = st.dur / 1000;
    if (now - S.cmdAt > 800 && st.playing !== S.playing){ S.playing = st.playing; syncKeys(); }
  }
}
function spotifyCtx(){
  if (!N || !N.spotifyContext) return null;
  try { const raw = N.spotifyContext(); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function spotifySaysAlbum(album){ const cx = spotifyCtx(); return !!cx && cx.type === 'album' && sameName(cx.album, album); }
/**
 * Which tape belongs in the player for what Spotify is playing.
 * Spotify's own answer (checked every few seconds) wins: a playlist in the drawer gets its tape,
 * an album gets the worn album tape. Without that answer, the old clues: the queue is named
 * after the album, or two songs in a row share one. onTrack: a new song just started.
 */
function judgeTape(st, prevAlbum, onTrack){
  // just after PHONY started something, Spotify's answer may still describe the last thing
  const cx = performance.now() < S.ctxHold ? null : spotifyCtx();
  if (cx && cx.type === 'playlist'){
    const pl = PLAYLISTS.find(p => p.uri === cx.uri);
    if (pl){ setPlaylist(pl); return; }
    if (S.playlist) setPlaylist(null); // another playlist, one not in the drawer
    setAlbumMode(false); return;
  }
  if (cx && cx.type === 'album' && sameName(cx.album, st.album)){ setPlaylist(null); setAlbumMode(true); return; }
  if (S.playlist){
    const albumQueue = !!st.album && sameName(st.queueTitle, st.album);
    if ((!cx && !albumQueue) || sameName(st.queueTitle, S.playlist.name) || performance.now() < S.ctxHold) return;
    setPlaylist(null);
  }
  if (onTrack) setAlbumMode(!!st.album && (sameName(st.queueTitle, st.album) || sameName(prevAlbum, st.album) || (!!S.boxAlbum && sameName(S.boxAlbum.title, st.album)) || (!!cx && cx.type === 'album' && sameName(cx.album, st.album))));
}
function buildRemoteTracks(queue){
  const R = S.r, hist = R.hist.slice(-8);
  // Spotify's queue starts with the song that's playing (sometimes after the ones already played); list only what comes next
  const at = queue.findIndex(q => sameName(q.title, R.cur.title));
  const upNext = at >= 0 ? queue.slice(at + 1) : queue;
  S.tracks = [...hist, R.cur, ...upNext.slice(0, 20).map(q => ({title:q.title, artist:q.artist || '', queueId:q.id}))];
  S.idx = hist.length; renderJList(); trackChanged();
}

function chooseSource(src, restoring){

/* ---------- main loop ---------- */
let last = performance.now(), rateTick = 0, timeTick = 0, cueSeekAt = 0;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  S.ej += ((S.ejected ? 1 : 0) - S.ej) * Math.min(1, dt * 9);
  const moving = (S.playing || S.cue) && !S.ejected;
  S.motor += ((moving ? 1 : 0) - S.motor) * Math.min(1, dt * (moving ? 14 : 20));
  pollNative(now);
  followPhoneVolume(now);
  if (S.cue && !S.ejected){
    S.t += S.cue * 9 * dt;
    if (S.src.kind === 'files'){ const nt = audio.currentTime + S.cue * 9 * dt; if (nt >= 0 && nt < (audio.duration || 1e9)) audio.currentTime = nt; S.t = audio.currentTime; }
    else if (isLocal() && now - cueSeekAt > 120){ cueSeekAt = now; N.seekTo(Math.max(0, Math.round(S.t * 1000))); }
    if (isRemote()) S.t = Math.max(0, Math.min(S.t, dur(S.idx) - 1));
  } else if (S.playing && !S.ejected){
    if (S.src.kind === 'demo') S.t += dt * S.motor; else if (S.src.kind === 'files') S.t = audio.currentTime || 0;
  }
  if (S.src.kind === 'demo' || S.src.kind === 'files' || (isLocal() && S.cue)){
    if (S.t >= dur(S.idx)){ if (S.idx < S.tracks.length - 1){ S.idx++; S.t = 0; if (S.src.kind !== 'demo') loadTrack(S.idx, true); else trackChanged(); } else endOfSide(); }
    else if (S.t < 0){ if (S.idx > 0){ S.idx--; S.t = dur(S.idx) - .1; if (S.src.kind !== 'demo'){ loadTrack(S.idx, true); if (isLocal()) N.seekTo(Math.round(S.t * 1000)); else audio.currentTime = S.t; } else trackChanged(); } else { S.t = 0; S.cue = 0; } }
  }
  const L = sideLen(), p = Math.max(0, Math.min(1, posSec() / L));
  // winding is quick but visible: never longer than about 2.5 s for a whole side
  const maxStep = Math.max(16 / L, .4) * dt, move = Math.max(-maxStep, Math.min(maxStep, p - S.dispP));
  S.dispP += move;
  const lenPerSec = (move / dt) * L * LINEAR;
  S.a1 += lenPerSec / packR(1 - S.dispP) * dt; S.a2 += lenPerSec / packR(S.dispP) * dt;
  const mult = Math.abs(move / dt * L);
  if (ac){
    const t = ac.currentTime;
    windGain.gain.setTargetAtTime(Math.max(0, Math.min(1, (mult - 1.6) / 9)) * .07, t, .04);
    windBP.frequency.setTargetAtTime(500 + mult * 110, t, .05);
    hissGain.gain.setTargetAtTime(S.fx && S.playing && !S.ejected ? .016 : 0, t, .05);
  }
  if (now - rateTick > (isLocal() ? 400 : 150) && S.fx && S.playing && !S.cue){
    rateTick = now;
    const ramp = Math.min(1, .92 + (now - S.startAt) / 3000);
    const rate = ramp * (1 + .0025 * Math.sin(now / 1000 * TAU * .55));
    if (isLocal()) N.setSpeed(rate);
    else if (S.src.kind === 'files') audio.playbackRate = rate;
  }
  if (S.src.kind === 'files') audio.volume = S.cue ? .35 : 1;
  $$('.runled').forEach(l => l.classList.toggle('on', S.motor > .5));
  if (S.open){
    updateCounter();
    if (now - timeTick > 250){ timeTick = now; $('#nowtime').textContent = `${fmt(Math.max(0, S.t))} / ${fmt(dur(S.idx))}`; }
    if (foldOpen) syncWords();
  }
  wins.forEach(drawWin);
  requestAnimationFrame(loop);
}

  CASES.unshift(al); renderBoxes(al.id);
  if (!S.ejected){ S.ejected = true; pause(); sfx('eject'); syncKeys(); showBox(); renderBoxes(al.id); }
};
window.phonyEject = () => { ensureAudio(); if (!S.ejected) eject(); };


/* ---------- the fold-out J-card: tap the song banner ---------- */
// front · spine · songs & credits · the words · liner notes · the band
let foldOpen = false, foldKey = '', foldAl = null, foldNotes = null, foldLyrics = null, foldLyrKey = '', foldReq = 0, foldTouchAt = 0, foldSync = null, foldLine = -1;
const fold = $('#fold'), foldStrip = $('#foldstrip'), foldScroll = $('#foldscroll');
const notesCache = {}, pending = {};
const plainSong = t => (t || '').replace(/\s*[(\[][^)\]]*[)\]]/g, '').replace(/\s+-\s+.*$/, '').trim().toLowerCase();
function ctxAlbumUri(album){ const cx = spotifyCtx(); return cx && cx.albumUri && album && sameName(cx.album, album) ? cx.albumUri : ''; }
// the album the current song comes from, and whatever PHONY already knows about it
function nowAlbum(){
  const tr = S.tracks[S.idx] || {};
  if (S.tape === ALBUM_TAPE && ALBUM.title){
    const cs = S.boxAlbum && CASES.find(c => c.id === S.boxAlbum.id);
    const own = cs && cs.tracks && cs.tracks.length ? cs.tracks.map(t => ({t:t.t, d:t.d}))
      : (S.src.kind !== 'remote' ? S.tracks.map(t => ({t:t.title, d:Math.round(t.dur || 0)})) : null);
    return {title:ALBUM.title, artist:ALBUM.artist || tr.artist || '', img:ALBUM.img, uri:cs ? cs.uri : ctxAlbumUri(ALBUM.title), tracks:own, year:cs ? cs.year : ''};
  }
  const album = tr.album || '';
  return {title:album, artist:tr.artist || '', img:album && sameName(album, ALBUM.title) ? ALBUM.img : null, uri:ctxAlbumUri(album), tracks:null, year:''};
}
const albumKey = al => ((al.title || '?') + '|' + (al.artist || '')).toLowerCase();
function openFold(){
  if (!S.open || foldOpen) return;
  ensureAudio(); sfx('paper');
  foldOpen = true; fold.hidden = false;
  const al = nowAlbum(); foldKey = albumKey(al); foldNotes = notesCache[foldKey] || null;
  foldLyrKey = ''; foldLyrics = null;
  buildFold(al); foldScroll.scrollLeft = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => fold.classList.add('show')));
  if (!foldNotes) askNotes(al);
  askLyrics();
}
function closeFold(){
  if (!foldOpen) return; foldOpen = false; sfx('paper');
  fold.classList.remove('show'); setTimeout(() => { if (!foldOpen){ fold.hidden = true; foldStrip.innerHTML = ''; } }, 750);
}
function askNotes(al){
  const key = albumKey(al);
  if (!N){ setTimeout(() => { notesCache[key] = demoNotes(al); if (foldOpen && key === foldKey){ foldNotes = notesCache[key]; buildFold(foldAl); } }, 700); return; }
  if (!al.title && !al.artist){ notesCache[key] = {}; foldNotes = {}; buildFold(al); return; }
  const id = 'n' + (++foldReq); pending[id] = key; N.fetchNotes(id, al.title || '', al.artist || '', al.uri || '');
}
function askLyrics(){
  const tr = S.tracks[S.idx] || {}, key = (tr.title || '') + '|' + (tr.artist || '');
  if (key === foldLyrKey) return; foldLyrKey = key; foldLyrics = null; renderWords();
  if (!tr.title) return;
  if (!N){ setTimeout(() => { if (foldLyrKey === key){ foldLyrics = demoWords(); renderWords(); } }, 500); return; }
  const id = 'l' + (++foldReq); pending[id] = key;
  N.fetchLyrics(id, tr.title, tr.artist || '', tr.album || (foldAl && foldAl.title) || '', Math.round(tr.dur || 0));
}
window.phonyNotes = id => {
  let j = null; try { j = JSON.parse(N.takeNotes(id) || 'null'); } catch (e) {}
  const key = pending[id]; delete pending[id]; if (!j) return;
  if (id[0] === 'n'){ notesCache[key] = j; if (foldOpen && key === foldKey){ foldNotes = j; buildFold(foldAl); } }
  else if (foldOpen && key === foldLyrKey){ foldLyrics = j; renderWords(); }
};
function foldTrackChanged(){
  const al = nowAlbum(), key = albumKey(al);
  if (key !== foldKey){ foldKey = key; foldNotes = notesCache[key] || null; buildFold(al); if (!foldNotes) askNotes(al); }
  else { const cur = plainSong((S.tracks[S.idx] || {}).title); $$('#foldstrip .ftr').forEach(r => r.classList.toggle('on', r.dataset.t === cur)); }
  askLyrics();
}

function inkAccent(hex){
  // dark enough to print on cream
  let v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  while (((r * .299 + g * .587 + b * .114) / 255) > .45){ r *= .82; g *= .82; b *= .82; }
  return '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('');
}
function drawFront(cv, img, title, artist, acc){
  const x = cv.getContext('2d'), w = cv.width, h = cv.height;
  if (img){ const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = Math.max(w / iw, h / ih); x.drawImage(img, (w - iw * k) / 2, (h - ih * k) / 2, iw * k, ih * k); }
  else {
    x.fillStyle = acc; x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(251,244,228,.14)'; for (let i = 0; i < 9; i++){ x.beginPath(); x.arc(w * .7, h * .38, w * (.08 + i * .06), 0, TAU); x.lineWidth = w * .012; x.strokeStyle = 'rgba(251,244,228,.16)'; x.stroke(); }
    x.fillStyle = '#fbf4e4'; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    fit(x, (title || '').toUpperCase(), w * .08, h * .82, w * .84, w * .13, PRINT, '800');
    x.globalAlpha = .8; fit(x, (artist || '').toUpperCase(), w * .08, h * .9, w * .84, w * .06, PRINT, '600'); x.globalAlpha = 1;
  }
  // it's been in a case for thirty years
  x.globalCompositeOperation = 'multiply'; x.fillStyle = 'rgba(236,216,178,.2)'; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'source-over';
  const r = rng(title.length * 31 + 5);
  for (let i = 0; i < 40; i++){ const px = r() * w, py = r() * h, len = w * (.02 + r() * .12), a = (r() - .5) * .8;
    x.strokeStyle = `rgba(255,248,232,${.05 + r() * .12})`; x.lineWidth = 1 + r() * 1.5; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len); x.stroke(); }
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function paras(parent, text){ (text || '').split(/\n+/).map(t => t.trim()).filter(Boolean).forEach(t => parent.append(el('p', '', t))); }
function niceDate(d){
  if (!d) return ''; const [y, m, dd] = d.split('-'); if (!m) return y;
  const mon = ['January','February','March','April','May','June','July','August','September','October','November','December'][+m - 1];
  return dd ? `${+dd} ${mon} ${y}` : `${mon} ${y}`;
}
function buildFold(al){
  foldAl = al;
  const n = foldNotes || {}, loading = !foldNotes, keep = foldScroll.scrollLeft;
  const tr = S.tracks[S.idx] || {};
  const title = n.title || al.title || tr.title || 'Untitled', artist = n.artist || al.artist || tr.artist || '';
  const year = (n.date || '').slice(0, 4) || al.year || '';
  foldStrip.innerHTML = '';
  let idx = 0; const panel = (cls) => { const p = el('section', 'fp ' + cls); p.style.setProperty('--i', idx++); foldStrip.append(p); return p; };

  // the cover: what the player already has, or what Spotify sent
  let img = al.img || null;
  const setAcc = im => { const acc = im ? inkAccent(paletteFrom(im)[1]) : '#b3362c'; fold.style.setProperty('--acc', acc); return acc; };
  let acc = setAcc(img);

  const front = panel('front'), cv = el('canvas', 'fart'); cv.width = cv.height = 900;
  const band = el('div', 'fband'); band.append(el('div', 'fa', artist), el('div', 'ft', title), el('div', 'fy', [year, 'STEREO', 'HIGH FIDELITY'].filter(Boolean).join('  ·  ')));
  front.append(cv, band); drawFront(cv, img, title, artist, acc);
  if (!img && n.cover){ const im = new Image(); im.onload = () => { acc = setAcc(im); drawFront(cv, im, title, artist, acc); }; im.src = n.cover; }

  const spine = panel('fspine'), sp = el('div', 'sp2'), sps = el('span', '', artist); sps.append(el('small', '', title)); sp.append(sps); spine.append(sp);

  // songs, split into two sides the way a cassette would be
  const songs = panel('songs'), sb = el('div', 'fbody'); songs.append(sb);
  const list = (n.tracks && n.tracks.length ? n.tracks : al.tracks) || [];
  if (list.length){
    const half = Math.ceil(list.length / 2), cur = plainSong(tr.title);
    [['SIDE A', list.slice(0, half), 0], ['SIDE B', list.slice(half), half]].forEach(([nm, part, off]) => {
      if (!part.length) return;
      const tot = part.reduce((a, t) => a + (t.d || 0), 0);
      const h = el('div', 'fside', nm); if (tot) h.append(el('small', '', fmt(tot))); sb.append(h);
      part.forEach((t, i) => { const r = el('div', 'ftr'); r.dataset.t = plainSong(t.t); if (r.dataset.t === cur) r.classList.add('on');
        r.append(el('span', 'n', String(off + i + 1)), el('span', 't', t.t), el('span', 'd', t.d ? fmt(t.d) : '')); sb.append(r); });
    });
  } else sb.append(el('div', 'fk', 'SONGS'), el('div', 'fwait', loading ? 'Pulling the card out of the case…' : 'No track list for this one.'));
  const cred = el('div', 'fcred');
  (n.copyrights || []).forEach(c => cred.append(el('div', '', /^[℗©]/.test(c) ? c : (/\(P\)/.test(c) ? c.replace('(P)', '℗') : '© ' + c))));
  if (n.date) cred.append(el('div', '', 'Released ' + niceDate(n.date)));
  if (cred.childNodes.length) sb.append(cred);

  // the words to whatever's playing
  const words = panel('words'), wb = el('div', 'fbody'); words.append(wb);
  wb.append(el('div', 'fk', 'THE WORDS'), el('div', 'fh', tr.title || ''), el('div', 'fwords'));
  wb.querySelector('.fh').id = 'fwordsh'; wb.querySelector('.fwords').id = 'fwords';
  ['touchstart', 'wheel', 'pointerdown'].forEach(ev => wb.addEventListener(ev, () => { foldTouchAt = performance.now(); }, {passive:true}));
  const src = el('div', 'fsrc', 'WORDS FROM LRCLIB.NET'); src.id = 'fwordsrc'; src.hidden = true; wb.append(src);

  // liner notes
  if (n.about || loading){
    const ln = panel('liner'), lb = el('div', 'fbody'); ln.append(lb);
    lb.append(el('div', 'fk', 'LINER NOTES'), el('div', 'fh', title));
    if (n.about){ paras(lb, n.about); lb.append(el('div', 'fsrc', 'FROM WIKIPEDIA · CC BY-SA')); }
    else lb.append(el('div', 'fwait', 'Pulling the notes out of the case…'));
  }
  // the band
  if (n.photo || n.band){
    const bp = panel('band'), bb = el('div', 'fbody'); bp.append(bb);
    bb.append(el('div', 'fk', 'THE BAND'));
    if (n.photo){ const fig = el('figure', 'fphoto'), im = new Image(); im.src = n.photo; im.alt = artist; fig.append(im, el('figcaption', '', artist)); bb.append(fig); }
    else bb.append(el('div', 'fh', artist));
    if (n.genres && n.genres.length){ const g = el('div', 'fgen'); n.genres.forEach(x => g.append(el('span', '', x))); bb.append(g); }
    if (n.band){ paras(bb, n.band); bb.append(el('div', 'fsrc', 'FROM WIKIPEDIA · CC BY-SA')); }
  }
  foldScroll.scrollLeft = keep;
  renderWords();
}
function renderWords(){
  const box = $('#fwords'); if (!box) return;
  const tr = S.tracks[S.idx] || {}; $('#fwordsh').textContent = tr.title || '';
  box.innerHTML = ''; foldSync = null; foldLine = -1; $('#fwordsrc').hidden = true;
  const L = foldLyrics;
  if (!L){ box.append(el('div', 'fwait', tr.title ? 'Looking for the words…' : '')); return; }
  const synced = (L.synced || '').split('\n').map(l => l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s?(.*)$/)).filter(Boolean);
  if (synced.length){
    foldSync = [];
    synced.forEach(m => { const t = +m[1] * 60 + +m[2], p = el('div', 'l' + (m[3].trim() ? '' : ' gap'), m[3]); foldSync.push({t, p}); box.append(p); });
  } else if (L.plain){
    L.plain.split('\n').forEach(t => box.append(el('div', 'l' + (t.trim() ? '' : ' gap'), t)));
  } else { box.append(el('div', 'fwait', L.instrumental ? 'No words. It\'s an instrumental.' : 'No words on file for this one.')); return; }
  box.classList.toggle('plain', !synced.length);
  $('#fwordsrc').hidden = !N;
}
// follow the song: light up the line being sung and keep it in view
function syncWords(){
  if (!foldOpen || !foldSync || !foldSync.length) return;
  const t = S.t + .25; let i = -1; for (let k = 0; k < foldSync.length; k++){ if (foldSync[k].t <= t) i = k; else break; }
  if (i === foldLine) return;
  if (foldLine >= 0 && foldSync[foldLine]) foldSync[foldLine].p.classList.remove('on');
  foldLine = i; if (i < 0) return;
  const p = foldSync[i].p; p.classList.add('on');
  if (performance.now() - foldTouchAt > 4000){ const body = p.closest('.fbody'); body.scrollTo({top:Math.max(0, p.offsetTop - body.clientHeight * .36), behavior:'smooth'}); }
}
// in a desktop browser there's no Spotify or network: stand-ins that say what goes where
function demoNotes(al){
  return {title:al.title || S.src.title, artist:al.artist || 'Various artists', date:'1988-06-14',
    copyrights:['℗ 1988 Driftwood Records', '© 1988 Driftwood Records'],
    tracks:S.tracks.map(t => ({t:t.title, d:Math.round(t.dur || 200)})), genres:['new wave', 'jangle pop'],
    about:'On the phone, this panel holds the story of the album that\'s playing, from Wikipedia: when and where it was made, who produced it, how it was received.\nIt changes with the record. Put on a different album and the card changes with it.',
    band:'And this panel is the band: a photo from Spotify, printed like the snapshot tucked into an old J-card, and a few paragraphs about who they are.'};
}
function demoWords(){
  const lines = ['On the phone, the words to the song', 'that\'s playing show up here,', '', 'one line lit at a time,', 'keeping pace with the tape.', '', 'Scroll back to read ahead;', 'it catches up in a moment.'];
  return {synced:lines.map((l, i) => `[00:${String(i * 4).padStart(2, '0')}.00] ${l}`).join('\n')};
}
$('#nowtext').addEventListener('click', openFold);
$('#nowtext').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openFold(); } });
$('#foldclose').addEventListener('click', closeFold);
foldScroll.addEventListener('click', e => { if (e.target === foldScroll || e.target === foldStrip) closeFold(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && foldOpen) closeFold(); });

/* ---------- boot ---------- */
applyFx(); setVol(N ? Math.max(0, N.getVolume()) : S.vol); renderJList(); tapeChanged(); layout();
const saved = store.get('src', null);
if (N && saved){
  if (saved.kind === 'remote' && N.hasListenerAccess()) chooseSource(saved, true);
  else if (saved.kind === 'local' && N.hasAudioPermission()) chooseSource(saved, true);
}
if (N && S.src.kind === 'demo') $('#mixtitle').textContent = 'Tap here for music';
// know the drawer's playlists from the start, so a playlist already playing in Spotify gets its tape
if (N) try { readBox(); } catch (e) {}
requestAnimationFrame(loop);
// the pens' fonts only load when asked for, and the tapes are drawn on canvas, so ask
const penFonts = ['"Permanent Marker"', '"Nothing You Could Do"', '"Rock Salt"', '700 1px Caveat', '"Gochi Hand"', '"Reenie Beanie"'];
if (document.fonts) Promise.all(penFonts.map(f => document.fonts.load((/^\d/.test(f) ? f : '40px ' + f)).catch(() => {}))).then(() => document.fonts.ready).then(() => {
  Object.keys(thumbCache).forEach(k => delete thumbCache[k]); refreshShells(); tapeChanged(); if (boxVisible()) renderBoxes();
});
})();
