name: Build PHONY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unpack the signing key
        env:
          KEYSTORE_B64: ${{ secrets.PHONY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/phony.jks"
            echo "PHONY_KEYSTORE_FILE=$RUNNER_TEMP/phony.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No PHONY_KEYSTORE_BASE64 secret yet. This build uses a throwaway key, so it won't install over a properly signed one."
          fi

      - name: Build the APK
        env:
          PHONY_KEYSTORE_PASSWORD: ${{ secrets.PHONY_KEYSTORE_PASSWORD }}
          # the Spotify app this build signs in as; without it, PHONY asks for a client ID on the phone
          PHONY_SPOTIFY_CLIENT_ID: ${{ secrets.PHONY_SPOTIFY_CLIENT_ID }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish to the "latest" download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk phony.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest phony.apk \
            --title "PHONY (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA::7}. On the phone, download phony.apk and open it to install or update." \
            --prerelease
